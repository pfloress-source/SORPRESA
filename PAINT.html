  <style>
    :root {
      --gold: #ff5a5a;
      --gold-soft: #ffa6a6;
      --cream: #fff8df;
      --ink: #fffaf0;
      --glass: rgba(255, 255, 255, .10);
      --glass-border: rgba(255, 255, 255, .22);
    }

    * {
      box-sizing: border-box;
    }

    body.container {
      overflow: hidden;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 78%, rgba(255, 205, 70, .18), transparent 25%),
        radial-gradient(circle at 20% 20%, rgba(255, 180, 80, .12), transparent 28%),
        linear-gradient(180deg, #071225 0%, #10254a 45%, #25183b 75%, #0a0c18 100%);
    }

    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .moon {
      position: absolute;
      width: 110px;
      height: 110px;
      top: 8%;
      right: 9%;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 35% 35%,
          #fffef2 0 30%,
          #ffeaa0 58%,
          rgba(255, 234, 160, .08) 70%,
          transparent 72%
        );
      filter: drop-shadow(0 0 30px rgba(255, 224, 130, .45));
      animation: moonFloat 6s ease-in-out infinite;
    }

    .moon::after {
      content: "";
      position: absolute;
      inset: 12px -8px -8px 18px;
      border-radius: 50%;
      background: #0c1730;
    }

    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 12% 18%, rgba(255,255,255,.85) 0 1px, transparent 2px),
        radial-gradient(circle at 31% 12%, rgba(255,255,255,.65) 0 1px, transparent 2px),
        radial-gradient(circle at 67% 18%, rgba(255,255,255,.8) 0 1px, transparent 2px),
        radial-gradient(circle at 82% 31%, rgba(255,255,255,.6) 0 1px, transparent 2px),
        radial-gradient(circle at 55% 35%, rgba(255,255,255,.55) 0 1px, transparent 2px),
        radial-gradient(circle at 9% 55%, rgba(255,255,255,.55) 0 1px, transparent 2px),
        radial-gradient(circle at 91% 62%, rgba(255,255,255,.8) 0 1px, transparent 2px);
      animation: twinkle 4s ease-in-out infinite alternate;
    }

    .message {
      position: fixed;
      z-index: 20;
      top: 7%;
      left: 50%;
      width: min(760px, 88vw);
      transform: translateX(-50%);
      padding: 20px 28px;
      text-align: center;
      color: var(--ink);
      background: linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.045));
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow:
        0 18px 60px rgba(0,0,0,.28),
        inset 0 1px rgba(255,255,255,.12);
      opacity: 0;
      animation: messageIn 1.5s 4.5s forwards;
    }

    .message .eyebrow {
      display: block;
      margin-bottom: 7px;
      color: var(--gold-soft);
      font: 600 11px/1.2 system-ui, sans-serif;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .message h1 {
      margin: 0;
      font: 500 clamp(18px, 2.2vw, 29px)/1.45 Georgia, serif;
      text-shadow: 0 2px 20px rgba(0,0,0,.35);
    }

    .message h1::after {
      content: " ✦";
      color: var(--gold);
    }

    .controls {
      position: fixed;
      z-index: 30;
      right: 20px;
      bottom: 20px;
      display: flex;
      gap: 8px;
    }

    .control {
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(10,18,38,.55);
      color: #fff;
      padding: 9px 13px;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      font: 500 12px system-ui, sans-serif;
      transition: .25s ease;
    }

    .control:hover {
      transform: translateY(-2px);
      background: rgba(255,216,90,.16);
      border-color: rgba(255,216,90,.45);
    }

    .petal {
      position: fixed;
      z-index: 10;
      top: -30px;
      width: 10px;
      height: 16px;
      border-radius: 80% 20% 80% 20%;
      background: linear-gradient(135deg, #ff8a8a, #f53d3d);
      box-shadow: 0 0 10px rgba(255, 90, 90, 0.3);
      pointer-events: none;
      animation: fall linear forwards;
    }

    .heart {
      position: fixed;
      z-index: 50;
      pointer-events: none;
      color: #ff5a5a;
      font-size: 18px;
      animation: heartUp 1.1s ease-out forwards;
    }

    .flowers {
      z-index: 5;
      filter: drop-shadow(0 16px 35px rgba(0,0,0,.28));
    }

    .night {
      opacity: .35;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translate(-50%, 12px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    @keyframes moonFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(8px);
      }
    }

    @keyframes twinkle {
      from {
        opacity: .45;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fall {
      0% {
        transform: translate3d(0,-30px,0) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: .9;
      }

      100% {
        transform: translate3d(var(--drift),110vh,0) rotate(520deg);
        opacity: 0;
      }
    }

    @keyframes heartUp {
      0% {
        opacity: 0;
        transform: translate(-50%,0) scale(.6);
      }

      20% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translate(-50%,-90px) scale(1.5);
      }
    }

    @media (max-width: 600px) {
      .moon {
        width: 75px;
        height: 75px;
        top: 5%;
        right: 6%;
      }

      .message {
        top: 4%;
        padding: 16px 18px;
        border-radius: 18px;
      }

      .message h1 {
        font-size: 17px;
      }

      .message .eyebrow {
        font-size: 9px;
      }

      .controls {
        right: 12px;
        bottom: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

  <script>
    const makePetal = () => {

      const p = document.createElement("span");

      p.className = "petal";

      p.style.left =
        Math.random() * 100 + "vw";

      p.style.setProperty(
        "--drift",
        (Math.random() * 180 - 90) + "px"
      );

      p.style.animationDuration =
        (6 + Math.random() * 7) + "s";

      p.style.transform =
        "rotate(" +
        Math.random() * 360 +
        "deg)";

      document.body.appendChild(p);

      setTimeout(
        () => p.remove(),
        14000
      );
    };

    setInterval(makePetal, 850);

    for (let i = 0; i < 7; i++) {
      setTimeout(makePetal, i * 300);
    }

    document.addEventListener(
      "click",
      (event) => {

        if (event.target.closest(".control")) {
          return;
        }

        const heart =
          document.createElement("span");

        heart.className = "heart";

        heart.textContent =
          Math.random() > .5 ? "✦" : "♥";

        heart.style.left =
          event.clientX + "px";

        heart.style.top =
          event.clientY + "px";

        document.body.appendChild(heart);

        setTimeout(
          () => heart.remove(),
          1200
        );
      }
    );

    const music =
      document.getElementById("music");

    const musicBtn =
      document.getElementById("musicBtn");

    musicBtn.addEventListener(
      "click",
      async () => {

        if (music.paused) {

          try {
            await music.play();
          } catch (e) {}

          musicBtn.textContent =
            "♫ Música";

        } else {

          music.pause();

          musicBtn.textContent =
            " 🔊 Música";
        }
      }
    );

    document.addEventListener(
      "pointerdown",
      () => {

        if (music.paused) {
          music.play().catch(() => {});
        }

      },
      { once: true }
    );
  </script>
